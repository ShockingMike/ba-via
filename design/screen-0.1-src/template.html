<title>Welcome Screen 0.1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
{{system_css}}
/* ---------- 0.1 Chào mừng: hộp đồ bỏ quên ----------
   THE APP NAME IS NOT FINAL. It lives in one place: --app-name below. No render contains it.
   Six registered felt layers from one camera (welcome2.py): box + dumbbells, lid, whoever peeks from inside
   (clipped to the gap between rim and lid), and the three friends standing in front of the open box.
   Rest = box cracked open, eyes in the gap. "Mở hộp" plays the reveal. */
:root{--app-name:"Ba Vía"}
.intro{max-width:1310px}
.top{flex:none;display:flex;align-items:center;justify-content:center;position:relative;height:60px;margin-top:6px}
.mark{display:inline-block;padding:7px 18px 6px;border-radius:14px;background:var(--ink);color:#FFF1D6;font:800 25px/1 var(--display);letter-spacing:.02em;transform:rotate(-2deg);
  box-shadow:0 0 0 2px var(--ink),0 10px 16px -10px rgba(42,35,64,.6);outline:2px dashed rgba(255,241,214,.75);outline-offset:-5px}
.mark::before{content:var(--app-name)}
.install{position:absolute;right:20px;top:50%;margin-top:-17px;height:34px;padding:0 13px;border-radius:17px;background:var(--card);box-shadow:var(--sh-card);font:700 13px/34px var(--body);color:var(--ink)}
.scene{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
.art{position:relative;width:104%;margin:0 -2%;aspect-ratio:{{ar}};display:block;flex:none;transform-origin:47% 62%;transform:scale(1.34) translateY(3%);transition:transform .7s cubic-bezier(.23,1,.32,1)}
.art.open{transform:scale(.9) translateX(-1.5%)}
.art img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.art .floor{left:{{floor_x}}%;top:{{floor_y}}%;bottom:auto;width:78%;height:16%;margin:-8% 0 0 -39%}
.art .clip{position:absolute;inset:0;clip-path:polygon(0 {{lid_l}}%,100% {{lid_r}}%,100% {{rim_r}}%,0 {{rim_l}}%)}
.art .lid{transform-origin:50% {{hinge}}%;animation:rattle 3.6s ease-in-out infinite}
@keyframes rattle{0%,58%,100%{transform:none}63%{transform:translateY(-1.6%) rotate(-1.4deg)}68%{transform:none}74%{transform:translateY(-2.200%) rotate(1.2deg)}80%{transform:none}}
.art .who{opacity:0}
.art.open .who{opacity:1}
.art.open .lid,.art.open .clip{opacity:0;animation:none}
.say{flex:none;text-align:center;min-height:124px}
.say h2{font:800 29px/1.14 var(--display);margin:0;text-wrap:balance}
.say p{margin:8px auto 0;max-width:300px;font:500 14px/1.45 var(--body);color:var(--ink-2);text-wrap:balance}
.w .panel{margin-top:0;padding-top:10px;padding-bottom:26px}
.restore{display:block;margin:10px auto 0;height:42px;padding:0 12px;font:500 14px/1 var(--body);color:var(--ink-2);border-radius:14px}
.restore b{font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--line)}
.restore:active{background:var(--chip)}
@media (prefers-reduced-motion:reduce){.art .lid{animation:none}.art{transition:none}}
</style>

<main class="desk">
  <header class="intro">
    <h1>0.1 · Chào mừng: hộp đồ bỏ quên</h1>
    <p>Màn đầu tiên của app, ba trạng thái. Bấm <b>Mở hộp</b> để xem cảnh ba người bạn tập chui ra; chạm vào cái hộp để đóng lại. Tên app là chữ thường, đổi ở một biến CSS.</p>
  </header>
  <div class="frames">
{{frames}}
  </div>
</main>

<script>
(function(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var qs=location.search||'';
  function fit(){document.querySelectorAll('.fit').forEach(function(f){var s=f.firstElementChild,k=Math.min(1,f.clientWidth/390);s.style.transform=k<1?'scale('+k+')':'';f.style.height=(844*k)+'px'})}
  fit();window.addEventListener('resize',fit);
  function toast(el,msg){el.textContent=msg;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on')},2600)}
  var EO='cubic-bezier(.23,1,.32,1)';
  function A(el,kf,o){if(reduce||!el.animate)return;o.fill='backwards';el.animate(kf,o)}
  document.querySelectorAll('.screen.w').forEach(function(sc){
    var art=sc.querySelector('.art'),say=sc.querySelector('.say'),cta=sc.querySelector('.btn-main'),sec=sc.querySelector('.restore'),ts=sc.querySelector('.toast');
    var rest={say:say.innerHTML,cta:cta.textContent,sec:sec.innerHTML};
    function stop(){art.querySelectorAll('*').forEach(function(e){e.getAnimations().forEach(function(a){if(!(a instanceof CSSAnimation))a.cancel()})})}
    /* the lid flies off, the three hop out of the box one after another, the nearest one last */
    function open(){
      if(art.classList.contains('open'))return;
      stop();art.classList.add('open');
      A(art.querySelector('.lid'),[{opacity:1,transform:'none'},{opacity:1,transform:'translateY(-60%) rotate(-12deg)',offset:.7},{opacity:0,transform:'translateY(-82%) rotate(-18deg)'}],{duration:560,easing:EO});
      A(art.querySelector('.clip'),[{opacity:1},{opacity:0}],{duration:160});
      [['gang','-16%',170],['binh','15%',270],['khan','0%',380]].forEach(function(c){
        A(art.querySelector('.'+c[0]),[{opacity:0,transform:'translate('+c[1]+',-6%) scale(.5)'},{opacity:1,transform:'translate(calc('+c[1]+' * .4),-20%) scale(.92)',offset:.42},
          {opacity:1,transform:'translate(0,1.5%) scale(1.05,.95)',offset:.8},{opacity:1,transform:'none'}],{duration:620,delay:c[2],easing:'cubic-bezier(.3,.6,.4,1)'});
      });
      say.innerHTML='<h2>Khăn, Bình và Găng chào chủ!</h2><p>Ở bước sau, chủ chọn một bạn để tập cùng.</p>';A(say,[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:300,delay:700,easing:EO});
      cta.textContent='Tiếp tục';cta.dataset.mode='next';sec.style.visibility='hidden';
    }
    function close(){stop();art.classList.remove('open');say.innerHTML=rest.say;cta.textContent=rest.cta;cta.dataset.mode=cta.dataset.rest;sec.style.visibility=''}
    cta.addEventListener('click',function(){if(cta.dataset.mode==='open')open();else toast(ts,cta.dataset.mode==='next'?sc.dataset.next:cta.dataset.toast)});
    sec.addEventListener('click',function(){if(sec.dataset.mode==='open')open();else toast(ts,sec.dataset.toast)});
    art.addEventListener('click',function(){if(art.classList.contains('open'))close();else open()});
    var ins=sc.querySelector('.install');if(ins)ins.addEventListener('click',function(){toast(ts,'Bản mẫu: sang 0.2, cài lên màn hình chính.')});
    if(/state=open/.test(qs))open();
  });
})();
</script>
